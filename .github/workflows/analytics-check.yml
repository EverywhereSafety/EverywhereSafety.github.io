name: Analytics coverage

on:
  push:
    paths:
      - '**/*.html'
      - 'assets/analytics.js'
      - 'scripts/sync_analytics.py'
      - 'tests/analytics.test.cjs'
      - '.github/workflows/analytics-check.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/analytics.js'
      - 'scripts/sync_analytics.py'
      - 'tests/analytics.test.cjs'
      - '.github/workflows/analytics-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python3 scripts/sync_analytics.py --check
      - run: node --test tests/analytics.test.cjs
